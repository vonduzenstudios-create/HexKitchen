name: Deploy to GitHub Pages

# Publishes the built game to the gh-pages branch. In the repo's Settings > Pages,
# set Source to "Deploy from a branch", branch gh-pages, folder / (root).
on:
  push:
    branches: [main, claude/hex-kitchen-demo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
